<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}{% endblock %} | Meal Planner</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <style>
        .recipe-steps p { margin-bottom: .5rem; }
        .card h2 a { text-decoration: none; }
    </style>
</head>
<body>
<nav class="navbar navbar-expand bg-body-tertiary mb-3">
    <div class="container">
        <a href="/" class="navbar-brand">🍽 Meal Planner</a>
        {% if user.is_authenticated %}
        <ul class="navbar-nav me-auto">
            <li class="nav-item"><a href="/" class="nav-link">This week</a></li>
            <li class="nav-item"><a href="{% url 'recipes' %}" class="nav-link">Recipes</a></li>
            {% if user.is_staff %}<li class="nav-item"><a href="/admin/" class="nav-link">Settings</a></li>{% endif %}
        </ul>
        <span class="navbar-text me-3">{{ user.first_name|default:user.username }}</span>
        <a class="btn btn-sm btn-outline-secondary" href="{% url 'logout' %}">Log out</a>
        {% endif %}
    </div>
</nav>
<main class="container pb-5">
    {% for message in messages %}
    <div class="alert {% if message.tags == 'error' %}alert-danger{% else %}alert-success{% endif %}">{{ message }}</div>
    {% endfor %}
    {% block body %}{% endblock %}
</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
<script>
// Claude-backed actions take a while; show it and prevent double submits.
document.querySelectorAll('form.slow').forEach(form => form.addEventListener('submit', () => {
    form.querySelectorAll('button').forEach(b => { b.disabled = true; });
    const btn = form.querySelector('button[type=submit]');
    if (btn) btn.innerHTML = '<span class="spinner-border spinner-border-sm"></span> Thinking…';
}));
</script>
</body>
</html>
